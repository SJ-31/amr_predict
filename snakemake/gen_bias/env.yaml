__use_yte__: true
__definitions__:
  - from pathlib import Path
  - import sys
  - from pyhere import here
  - args = sys.argv
  - home = str(Path.home())
  - workdir = here() / "snakemake/gen_bias"
  - test = ("test=True" in args) or ("test=true" in args)
  - testdir = here() / "tests"
  - on_server = home != "/home/shannc"
  - remote = "/data/project/stemcell/shannc/repos/amr_predict"
  - outdir = f"{remote}/2026-09-16_gen_bias"

slurm_time_limit: 18-00:00:00
huggingface: ?"/data/project/stemcell/shannc/repos/amr_predict/cache/huggingface" if on_server else str(Path.home() / ".cache/huggingface")
# Timing (1500 sequences, [2026-10-01 Thu])
# evo1 131 k: 60m
# evo2 7b: 55m
# genome ocean 4b: 5m

outdir: ?outdir
taxdb: ?f"{remote}/mmseqs2/db/nt"
tmp: ".env_tmp"
n: 2000
gen_batch_size: 15
rng: 44342
meta: "prompts.csv" # CSV defining prompts and their metadata
# this is where perturbation sensitivity gets defined

resources:
  gpu40:
    mem: 64g
    qos: gpu40g
    gres: "gpu:7g.40gb:1"
    slurm_partition: gpu
  big_mem:
    mem: 100G
    qos: cpu24h

fimo:
  default: "/data/project/stemcell/shannc/repos/amr_predict/meme_motif_databases_2025-06-28/JASPAR/JASPAR2024_CORE_non-redundant_v2.meme" # WARNING: this is very slow, so define a prompt-specific motif file whenever possible
  thresh: 0.00001

# Shared arguments:
# - num (number of sequences to generate)
# - prompt (prompt file or sequence)
# - output_scores (file to output scores to)
# - gen_batch_size
# - top_k
# - top_p
# - seq_len (maximum sequence length)
# - prepend_prompt_to_output
# - seed

singularity:
  # classify_taxonomy:
  similarity: ?f"{remote}/images/parasail.sif"
  find_motifs: ?f"{remote}/images/meme.sif"
  generate:
    evo1: ?f"{remote}/images/evo_design.sif"
    genome_ocean_1: ?f"{remote}/images/genome_ocean.sif"
    evo2_7b: ?f"{remote}/images/evo.sif"

models: # dictionary mapping model name

parasail:
  fn: "sw_stats_striped_16" # Use local alignments (default) because similar subsequences (e.g. domains) is a more reasonable expectation than having similarity across the entire sequence

describe_protein_seqs:
  molecular_weight:
  ms_whim_scores:
  charge:
    pKscale: EMBOSS
  t_scales:
  hydrophobicity:
    scale: Janin
