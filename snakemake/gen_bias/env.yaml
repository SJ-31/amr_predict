__use_yte__: true
__definitions__:
  - from pathlib import Path
  - import sys
  - from pyhere import here
  - args = sys.argv
  - home = str(Path.home())
  - workdir = here() / "snakemake/gen_bias"
  - test = ("test=True" in args) or ("test=true" in args)
  - testdir = here() / "tests"
  - on_server = home != "/home/shannc"
  - remote = "/data/project/stemcell/shannc/repos/amr_predict"
  - outdir = f"{remote}/2026-09-16_gen_bias"

slurm_time_limit: 18-00:00:00
huggingface: ?"/data/project/stemcell/shannc/repos/amr_predict/cache/huggingface" if on_server else str(Path.home() / ".cache/huggingface")

outdir: ?outdir
taxdb: ?f"{remote}/blast/db/nt"
tmp: ".env_tmp"
n: 20000
rng: 44342
meta: "TODO" # CSV defining prefixes and their metadata
# this is where perturbation sensitivity gets defined
# TODO: can add a helper script that generates the prefixes

resources:
  gpu40:
    mem: 64g
    qos: gpu40g
    gres: "gpu:7g.40gb:1"
    slurm_partition: gpu

fimo:
  default: "/data/project/stemcell/shannc/repos/amr_predict/meme_motif_databases_2025-06-28/JASPAR/JASPAR2024_CORE_non-redundant_v2.meme" # WARNING: this is very slow, so define a prefix-specific motif file whenever possible
  thresh: 0.00001

# Shared arguments:
# - num (number of sequences to generate)
# - prompt (prompt file or sequence)
# - top_k
# - top_p
# - seq_len (maximum sequence length)

singularity:
  # classify_taxonomy:
  similarity: ?f"{remote}/images/parasail.sif"
  find_motifs: ?f"{remote}/images/meme.sif"
  generate:
    evo1: ?f"{remote}/images/evo_design.sif"
    genome_ocean_1: ?f"{remote}/images/genome_ocean.sif"

models: # dictionary mapping model name
  evo1:
    script: scripts/evo_design.py
    resources: "gpu40g"
    kws:
      seq_len: 512
      device: "cuda:0"
      model_name: evo-1-8k-base
  genome_ocean_1:
    script: scripts/genome_ocean.py
    resources: "gpu40g"
    kws:
      min_seq_len: 512
      seq_len: 1024

describe_protein_seqs:
  molecular_weight:
  ms_whim_scores:
  charge:
    pKscale: EMBOSS
  t_scales:
  hydrophobicity:
    scale: Janin
