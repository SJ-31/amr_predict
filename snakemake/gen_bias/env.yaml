__use_yte__: true
__definitions__:
  - from pathlib import Path
  - import sys
  - from pyhere import here
  - args = sys.argv
  - home = str(Path.home())
  - workdir = here() / "snakemake/gen_bias"
  - test = ("test=True" in args) or ("test=true" in args)
  - testdir = here() / "tests"
  - on_server = home != "/home/shannc"
  - remote = "../../data/remote"
  - outdir = f"{remote}/2026-09-16_gen_bias" if not test else f"{remote}/tests/gen_bias"

slurm_time_limit: 18-00:00:00
huggingface: ?f"{remote}/cache/huggingface" if on_server else str(Path.home() / ".cache/huggingface")

tmp: ".env_tmp"
n: 20000
rng: 44342
meta: # CSV defining prefixes and their metadata
# this is where perturbation sensitivity gets defined
# TODO: can add a helper script that generates the prefixes

resources:
  gpu40:
    mem: 64g
    qos: gpu40g
    gres: "gpu:7g.40gb:1"
    slurm_partition: gpu

find_motifs:

