__use_yte__: true
__definitions__:
  - from pathlib import Path
  - import sys
  - from pyhere import here
  - remote = "/data/project/stemcell/shannc/repos/amr_predict"
  - testdir = here() / "tests"

n: 10
meta: ?testdir / "data"/ "gen_prefixes.csv"
outdir: ?f"{remote}/tests/gen_bias"

taxdb: ?f"{remote}/blast/db_test/nt"

resources:
  gpu40:
    mem: 32g
    qos: gpu40g
    gres: "gpu:7g.40gb:1"
    slurm_partition: gpu

