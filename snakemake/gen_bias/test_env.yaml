__use_yte__: true
__definitions__:
  - from pathlib import Path
  - import sys
  - from pyhere import here
  - remote = "/data/project/stemcell/shannc/repos/amr_predict"
  - testdir = here() / "tests"

n: 4
meta: ?str(testdir / "data"/ "gen_prefixes.csv")
outdir: ?f"{remote}/tests/gen_bias"
taxdb: ?f"{remote}/mmseqs2/db_test/nt"

resources:
  gpu40:
    mem: 32g
    qos: gpu40g
    gres: "gpu:7g.40gb:1"
    slurm_partition: gpu

models: # dictionary mapping model name
  evo1:
    script: scripts/evo_design.py
    resources: "gpu40g"
    kws:
      device: "cuda:0"
      model_name: evo-1-8k-base
  genome_ocean_1:
    script: scripts/genome_ocean.py
    resources: "gpu40g"
    kws:
      model_name: GenomeOcean-100M
