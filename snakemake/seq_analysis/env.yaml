__use_yte__: true
__definitions__:
  - from pathlib import Path
  - import sys
  - args = sys.argv
  - home = str(Path.home())
  - test = ("test=True" in args) or ("test=true" in args)
  - remote = "../../data/remote"
  - outdir = f"{remote}/2026-04-11_seq_analysis" if not test else f"{remote}/tests/seq_analysis"
__variables__:
  seed: 429472
# NOTE: Using 'x' as the embedding key and 'id' as the sample id

log_wandb: false # [2026-08-25 Tue] disabled due to WandB import issues
wandb_project: amr_predict-seqs
test: ?test

huggingface: ?f"{remote}/cache/huggingface"
slurm_time_limit: "18-00:00:00"
# NOTE: limit for gpu40g is hard-capped at 8 hrs
outdir: ?outdir
rng: ?int(seed)

write_training_indices:
  test_size: 0.4
  shuffle: true

rewrite_cache:
  null
  # keep_only: false # BUG: See how big it is after removing duplicates
  # size: 500MB

train_sae:
  trainer:
    max_epochs: 200
    log_every_n_steps: 3
    enable_progress_bar: false
  dataloader:
    batch_size: 64 # BUG: [2026-08-29 Sat] Trying smaller batch size to avoid OOM

co_occurence_min_support: 0.3

label_clustering:
  min_height: 0.7
  method: average # One of single, complete, average, weighted
  metric: jaccard

metadata:
  file: "../../data/meta/2026-06-17_uniprot_swissprot_goa_labelled.csv"
  sample_col:
    default: "Entry"
    aa: "Entry"
    nuc: "Ensembl"
  label_col: "All annotations"
  label_sep: ";"

sequence_variants:
  random:
    permuted:
      method: permutation
      kws:
        rng: ?this["rng"]
    denovo:
      method: denovo
      kws:
        rng: ?this["rng"]
        with_distribution: true
  perturbed:
    lg_substitution:
      method: substitution_matrix
      seqtype: aa
      kws:
        matrix: LG
        k: 5
        replacement_rate: 0.6
    codon_optimization_human:
      method: codon_optimization
      seqtype: nuc
      kws:
        species: h_sapiens

resources:
  gpu40:
    mem: 64g
    qos: gpu40g
    gres: "gpu:7g.40gb:1"
    slurm_partition: gpu

# TODO: set up interplm
# TODO: but you can also train with their pipeline. Might be easier and you can make
# use of their metrics. Only thing you'll need to do is configure the esm embedding function in SeqEmbedder to get the embedder from interplm.embedders, and call embed_single_sequence or embed batch

# NOTE: can't use interplm because it's trained on token-level embeddings, unlike what
# you will pass to it
saes: # Mapping of
  pretrained:
    # interplm_1:
    #   source: interplm
    #   level: "tokens"
    #   kws:
    #     plm_model: "esm2_t6_8"
    #   embedding: esm2
  custom:
    batchtopk_50:
      variant: "BatchTopK"
      scale_dict_size: True
      kws:
        dict_size: 8
        top_k: 50 # [2026-04-20 Mon] could determine optimal with hparam sweep

  # should be the name of an sae in the `to_train` mapping

  # esmc official has embeddings of shape 1152
  # MODEL_DIMS = {
  #        "facebook/esm2_t6_8M_UR50D": 320,
  #        "facebook/esm2_t12_35M_UR50D": 480,
  #        "facebook/esm2_t30_150M_UR50D": 640,
  #        "facebook/esm2_t33_650M_UR50D": 1280,
  #        "facebook/esm2_t36_3B_UR50D": 2560,
  #        "facebook/esm2_t48_15B_UR50D": 5120,
  #    }

eval_sae:
  threshold: 0.8 # TODO: should decide this from data
  top_k: 20 # TODO: can add more, but keep it like this for now

dummy_embeddings:
  n: 10000 # Number of samples to take from metadata
  splits: [0.5, 0.25, 0.25] # Training splits
  sizes: [512, 1080]
  nonlinearity: "tanh"
  noise_scale: 0.03

embedding_methods:
  aa:
    esmc:
      model: esmc_600m
      poolings:
        max: {}
        mean: {}
        sum: {}
      kws:
        token_amount: 10
  nuc:
    omniNA: # [2026-08-31 Mon] REVIEW: see if this works now that you fixed the nonsense...
      model: "XLS/OmniNA-220m"
      poolings:
        max: {}
        mean: {}
        sum: {}
      kws:
        token_amount: 10
    # ntv3:
    #   model: "InstaDeepAI/NTv3_100M_pre"
    #   poolings:
    #     max: {}
    #     mean: {}
    #     sum: {}
    #   kws:
    #     token_amount: 10
    #     hidden_layer: 2 # TODO: decide on this
  # nuc:
  # seqlens:

fastas: #
  aa:
    - file: ?f"{remote}/datasets/2026-04-10_GOA/2026-06-02_aa_subsampled.fasta"
      header_style: uniprot
    - file: ?f"{remote}/datasets/2026-04-10_uniprot_swissprot/2026-06-02_annotation_level_4_subsampled.fasta"
      header_style: uniprot
    - file: ?f"{remote}/datasets/2026-04-10_uniprot_swissprot/2026-06-02_annotation_level_5_subsampled.fasta"
      header_style: uniprot
  nuc:
    - file: ?f"{remote}/datasets/2026-04-21_uniprot_swissprot_goa_nuc.fasta"
      header_style: ensembl

neighbor_metrics:
  anno_sep: ";"
  category_cols: ["BP_custom", "CC_custom", "MF_custom"]
  anno_cols: ["All annotations"]
  subsample: ?0.01 if test else 0.2
  n_neighbors: 8
  n_resample: 10_000

embedding_correlations:
  columns:
    "Gene Ontology IDs": functional_similarity
    InterPro: functional_similarity
    sequence: sequence_similarity
    "Organism (ID)": taxonomic_similarity
  embedding_distance: euclidean
  sequence_distance: "kmer"
  n_resample: ?1000 if test else 10_000
  anno_sep: ";"
  tree_file: "../../data/meta/nodes.dmp" # Binding
  # `data` directory with singularity

find_baseline:
  n_repeats: ?3 if test else 5
  split_kws:
  classifiers:
    RandomForest:
    Lasso:
    SVM:
      kernel: "rbf"

perturbation_metrics:
  id_col: id
  embedding_distance: euclidean
  classifier_name: RandomForest
  cv: ?3 if test else 5
  n_distance_resampling: ?3 if test else 5
  rns_kws:
    n_neighbors: ?5 if test else 10

probing:
  classifiers:
    RandomForest: {}
    Lasso: {}
    SVM:
      kernel: "rbf"
  permutation_tests:
    use_cv: true
    r: ?3 if test else 5
    k: ?10 if test else 30 # NOTE: Author's recommendations of r = 10, k = 100, are too slow
    # unfortunately
    cv_kws:
      n_repeats: 3
      n_splits: 5
      random_state: ?this["rng"]

  tasks:
    go_cc: "CC_custom"
    go_mf: "MF_custom"
    go_bp: "BP_custom"
    # family: "family"
    # orthogroup: "OrthoDB"

# TODO: after choosing some good latents, can also plot curves for them

ablation_analysis:
  spec:
    []
    # - seqtype:
  #   level:
  #   sae:
  #   embedding:
  #   pooling:
  #   to_ablate:
  loader_kws: {}
  probe: Lasso
  probe_kws: {}
  eval_kws:
    n_splits: 5
    n_repeats: 3
